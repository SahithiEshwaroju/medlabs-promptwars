name: MedLens CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Core Clinical Safety & API Tests
      run: |
        python -m unittest discover -s backend/tests -p "test_*.py" -v

  frontend-tests-and-build:
    name: Frontend Tests, Lint & Build (Node 20)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci || npm install

    - name: Run Frontend Safety & Logic Unit Tests
      run: |
        cd frontend
        npm test

    - name: Run Static Analysis & Linter
      run: |
        cd frontend
        npm run lint

    - name: Build Production Bundle
      run: |
        cd frontend
        npm run build
