# Render Blueprint Specification for MedLens (Free Plan)
# Reference: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: medlens-backend
    env: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # ---------------------------------------------------------------------------
  # 2. React Vite Frontend Static Site (100% Free Forever, Fast CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: medlens-frontend
    env: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medlens-backend
          property: host
