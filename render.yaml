# Render Blueprint Specification for MedLens (Unified Free Plan)
# Reference: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Unified Full-Stack Web Service (FastAPI + Embedded React Frontend)
  # Serves both Frontend (React/Vite) & Backend (FastAPI) from a single URL!
  # ---------------------------------------------------------------------------
  - type: web
    name: medlens
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
